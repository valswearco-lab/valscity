<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VALS · City</title>
<style>
:root {
  --cream:#FAF7F2; --ivory:#F2E8DC; --tan:#C9A882; --tan2:#E8D5BB;
  --brown:#2C2420; --brown2:#6B4F3A; --sage:#B8C4B1; --sage2:#7A9170;
  --rose:#E8C4B8; --rose2:#D4A898; --slate:#8A9BA8;
  --green:#5A8A6A; --red:#A05050; --gold:#C9A882;
  --border:#E0D4C4; --muted:#9A8878; --white:#FFFEFB;
  --ground:#D4C8B4; --grass:#C4D0B4; --path:#C8BCB0; --sky1:#D8ECF8; --sky2:#EAE0D4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter','Helvetica Neue',sans-serif;background:var(--cream);color:var(--brown);overflow:hidden}

/* ── HEADER ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;height:52px;
  background:rgba(250,247,242,0.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;gap:12px}
.logo{font-family:Georgia,serif;font-size:18px;letter-spacing:5px;font-weight:700;color:var(--brown);flex-shrink:0}
.hdr-stats{display:flex;gap:16px;align-items:center}
.hs{text-align:center}
.hs-v{font-size:13px;font-weight:700;line-height:1}
.hs-l{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:1px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#5A8A6A;display:inline-block;margin-right:4px;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── CITY CONTAINER ── */
.city-wrap{position:fixed;inset:0;top:52px;bottom:60px;overflow:hidden;cursor:grab}
.city-wrap:active{cursor:grabbing}

/* Sky gradient */
.sky-bg{position:absolute;inset:0;
  background:linear-gradient(180deg,#C8E4F8 0%,#DCF0F8 25%,#EEE4D8 55%,#D8CCBC 100%);
  pointer-events:none}

/* ── ISOMETRIC SCENE ── */
.iso-scene{position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) rotateX(60deg) rotateZ(-45deg);
  transform-style:preserve-3d;
  width:900px;height:900px;
  transition:transform .1s ease}

/* Ground plane */
.ground{position:absolute;inset:0;
  background:linear-gradient(135deg,#D4CCBC 0%,#C8C0AC 50%,#BEB4A0 100%);
  border-radius:12px}

/* Grass patches */
.grass{position:absolute;background:#C4D0B0;border-radius:50%}

/* Paths */
.path{position:absolute;background:var(--path);border-radius:2px}

/* ── BUILDINGS ── */
.b{position:absolute;transform-style:preserve-3d;cursor:pointer;transition:filter .2s}
.b:hover{filter:brightness(1.08) drop-shadow(0 2px 8px rgba(201,168,130,.5))}
.b.sel{filter:brightness(1.12) drop-shadow(0 3px 14px rgba(201,168,130,.7))}

/* building faces */
.b-top,.b-front,.b-right{position:absolute}
.b-top{transform-origin:0 0}
.b-front{transform-origin:0 0}
.b-right{transform-origin:0 0}

/* ── CHARACTERS (animated SVG) ── */
.char-wrap{position:absolute;transform-style:preserve-3d;pointer-events:none;z-index:50}
.char-svg{width:32px;height:44px;display:block}
/* walking path animation via keyframes per char */
.char-shadow{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:20px;height:6px;background:rgba(0,0,0,0.12);border-radius:50%;filter:blur(2px)}

/* ── PANEL ── */
.overlay{position:fixed;inset:0;background:rgba(44,36,32,.25);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:all}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(480px,100vw);
  background:var(--white);z-index:201;
  transform:translateX(100%);transition:transform .32s cubic-bezier(.32,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(44,36,32,.1)}
.panel.open{transform:translateX(0)}
.ph{padding:18px 20px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.ph-title{font-family:Georgia,serif;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.ph-emoji{font-size:20px}
.ph-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
  background:transparent;cursor:pointer;font-size:14px;color:var(--muted);
  display:flex;align-items:center;justify-content:center}
.ph-close:hover{background:var(--ivory)}
.pb{flex:1;overflow-y:auto;padding:16px 20px}

/* ── DATA COMPONENTS ── */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:14px}
.kbox{background:var(--ivory);border-radius:10px;padding:11px 8px;text-align:center;border:1px solid var(--border)}
.kbox.hi{background:var(--tan2);border-color:var(--tan)}
.kv{font-family:Georgia,serif;font-size:17px;font-weight:700;line-height:1}
.kl{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
.sh{display:flex;justify-content:space-between;align-items:center;margin:14px 0 7px}
.st{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.bsm{padding:5px 11px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:700;
  background:var(--brown);color:var(--white)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:5px 7px;border-bottom:1px solid var(--border);
  font-size:8px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.tbl td{padding:7px;border-bottom:1px solid var(--ivory);vertical-align:top}
.tbl tr:hover td{background:var(--ivory);cursor:pointer}
.nr{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--green);font-weight:700}
.neg{color:var(--red);font-weight:700}
.tag{display:inline-block;padding:2px 7px;border-radius:99px;font-size:9px;font-weight:700}
.tg{background:var(--tan2);color:var(--brown2)}
.ts{background:#E0EAD8;color:var(--sage2)}
.tr{background:#FEE2E2;color:var(--red)}
.bw{background:var(--ivory);border-radius:99px;height:6px;overflow:hidden;margin-top:3px}
.bf{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--tan2),var(--tan))}
/* form */
.fr{margin-bottom:10px}
.fl{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:4px;display:block}
.fi{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;
  font-size:13px;font-family:inherit;background:var(--ivory);color:var(--brown)}
.fi:focus{outline:none;border-color:var(--tan)}
.cr{display:flex;flex-wrap:wrap;gap:5px}
.ch{padding:4px 10px;border-radius:99px;border:1.5px solid var(--border);
  font-size:11px;font-weight:700;cursor:pointer;background:var(--ivory);color:var(--muted)}
.ch.sl{border-color:var(--brown);background:var(--brown);color:var(--white)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

/* ── MODALS ── */
.mbg{position:fixed;inset:0;background:rgba(44,36,32,.4);z-index:300;
  display:none;align-items:flex-end;justify-content:center}
.mbg.open{display:flex}
.mo{background:var(--white);border-radius:20px 20px 0 0;padding:20px;
  width:100%;max-width:460px;max-height:88vh;overflow-y:auto}
.mt{font-family:Georgia,serif;font-size:16px;font-weight:700;margin-bottom:14px}
.mf{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:11px;border-radius:9px;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit}
.bc{background:var(--ivory);border:1px solid var(--border);color:var(--brown)}
.bs{background:var(--brown);color:var(--white);flex:2}

/* preview */
.prev{background:var(--brown);border-radius:10px;padding:11px;margin:8px 0;color:white}
.pg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;text-align:center}
.pv{font-family:Georgia,serif;font-size:14px;font-weight:700}
.pl{font-size:8px;color:rgba(255,255,255,.55);margin-top:2px}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;height:60px;z-index:100;
  background:rgba(250,247,242,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);display:flex;align-items:center;
  padding:0 8px}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border:none;background:transparent;cursor:pointer;
  border-top:2px solid transparent;color:var(--muted);transition:all .15s;font-family:inherit}
.nb.ac{color:var(--brown);border-top-color:var(--tan)}
.nb-i{font-size:17px;line-height:1}
.nb-l{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}

/* ── TOAST ── */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--brown);color:var(--white);padding:9px 18px;border-radius:99px;
  font-size:12px;font-weight:700;z-index:400;opacity:0;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── KOL CARD ── */
.kol-card{background:var(--ivory);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--border)}
.kol-name{font-weight:700;font-size:13px}
.kol-status{font-size:10px;color:var(--muted);margin-top:2px}

/* ── CONTENT CAL ── */
.cal-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ivory)}
.cal-date{width:36px;text-align:center;flex-shrink:0}
.cal-day{font-size:18px;font-weight:800;line-height:1;color:var(--brown)}
.cal-mo{font-size:9px;color:var(--muted);text-transform:uppercase}
.cal-body{flex:1}
.cal-title{font-size:12px;font-weight:700}
.cal-ch{font-size:10px;color:var(--muted);margin-top:1px}

@media(max-width:600px){
  .hdr-stats{display:none}
  .panel{width:100vw}
  .ph-title{font-size:14px}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="logo">VALS</div>
  <div class="hdr-stats">
    <div class="hs"><div class="hs-v" id="hRev">—</div><div class="hs-l">Revenue</div></div>
    <div class="hs"><div class="hs-v" id="hProfit">—</div><div class="hs-l">Profit</div></div>
    <div class="hs"><div class="hs-v" id="hUnits">—</div><div class="hs-l">Units</div></div>
    <div class="hs"><div class="hs-v" id="hRecov">—</div><div class="hs-l">Recovery</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:5px">
    <span class="live-dot"></span>
    <span style="font-size:10px;color:var(--muted)" id="syncLbl">connecting…</span>
  </div>
</header>

<!-- CITY -->
<div class="city-wrap" id="cityWrap">
  <div class="sky-bg"></div>

  <!-- MAIN ISOMETRIC SCENE (flat 2.5D approach for better mobile) -->
  <svg id="citySvg" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg"
    style="width:100%;height:100%;display:block">
    <defs>
      <filter id="sh"><feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#2C2420" flood-opacity=".14"/></filter>
      <filter id="shB"><feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#2C2420" flood-opacity=".1"/></filter>
      <radialGradient id="groundGrad" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="#D8CFBE"/>
        <stop offset="100%" stop-color="#C4BAA8"/>
      </radialGradient>
      <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#C8E4F8"/>
        <stop offset="60%" stop-color="#DCE8F0"/>
        <stop offset="100%" stop-color="#E8E0D4"/>
      </radialGradient>
    </defs>

    <!-- SKY -->
    <rect width="1000" height="700" fill="url(#skyGrad)"/>

    <!-- SUN -->
    <circle cx="820" cy="80" r="38" fill="#FFF0C8" opacity=".9"/>
    <circle cx="820" cy="80" r="48" fill="#FFF0C8" opacity=".3"/>

    <!-- CLOUDS -->
    <g opacity=".75">
      <ellipse cx="140" cy="90" rx="55" ry="18" fill="white"/>
      <ellipse cx="120" cy="84" rx="28" ry="22" fill="white"/>
      <ellipse cx="158" cy="80" rx="22" ry="18" fill="white"/>
    </g>
    <g opacity=".6">
      <ellipse cx="580" cy="60" rx="45" ry="14" fill="white"/>
      <ellipse cx="562" cy="55" rx="22" ry="17" fill="white"/>
      <ellipse cx="598" cy="53" rx="18" ry="14" fill="white"/>
    </g>
    <g opacity=".5">
      <ellipse cx="880" cy="130" rx="38" ry="12" fill="white"/>
      <ellipse cx="865" cy="125" rx="18" ry="14" fill="white"/>
      <ellipse cx="895" cy="123" rx="15" ry="12" fill="white"/>
    </g>

    <!-- GROUND PLANE (isometric parallelogram) -->
    <polygon points="500,140 920,360 500,580 80,360" fill="url(#groundGrad)"/>

    <!-- GRASS areas -->
    <polygon points="500,140 700,240 600,280 400,180" fill="#C8D4B0" opacity=".7"/>
    <polygon points="500,580 350,500 420,460 570,540" fill="#C4D0AC" opacity=".6"/>
    <polygon points="920,360 800,420 750,380 870,320" fill="#C8D4B0" opacity=".5"/>
    <polygon points="80,360 200,300 250,340 130,400" fill="#C4D0AC" opacity=".5"/>

    <!-- PATHS (isometric roads) -->
    <!-- main vertical -->
    <polygon points="480,220 520,220 560,480 440,480" fill="#C8BEB0" opacity=".9"/>
    <!-- horizontal crossroad -->
    <polygon points="200,345 800,345 810,375 190,375" fill="#C8BEB0" opacity=".8"/>
    <!-- diagonal path top-right -->
    <polygon points="520,220 560,200 660,250 620,270" fill="#C8BEB0" opacity=".7"/>
    <!-- diagonal path top-left -->
    <polygon points="480,220 440,200 340,250 380,270" fill="#C8BEB0" opacity=".7"/>
    <!-- path marks -->
    <line x1="500" y1="230" x2="500" y2="475" stroke="#B8B0A0" stroke-width="1.5" stroke-dasharray="8,10" opacity=".5"/>

    <!-- ══ TREES ══ -->
    <!-- cluster top-left -->
    <g filter="url(#shB)">
      <polygon points="200,195 210,220 190,220" fill="#8B7040"/>
      <polygon points="192,205 218,205 210,185 200,178" fill="#6A8848"/>
      <polygon points="196,195 214,195 206,176" fill="#7A9A55"/>
    </g>
    <g filter="url(#shB)" transform="translate(22,8)">
      <polygon points="200,195 208,215 192,215" fill="#8B7040"/>
      <polygon points="194,207 214,207 208,190 200,183" fill="#6A8848"/>
      <polygon points="197,198 211,198 204,179" fill="#7A9A55"/>
    </g>
    <g filter="url(#shB)" transform="translate(-18,14)">
      <polygon points="200,195 207,212 193,212" fill="#8B7040"/>
      <polygon points="195,206 211,206 206,191 200,185" fill="#6A8848"/>
      <polygon points="197,198 209,198 203,181" fill="#7A9A55"/>
    </g>

    <!-- cluster top-right -->
    <g filter="url(#shB)">
      <polygon points="740,190 750,215 730,215" fill="#8B7040"/>
      <polygon points="732,202 758,202 750,182 740,175" fill="#6A8848"/>
      <polygon points="736,192 754,192 746,173" fill="#7A9A55"/>
    </g>
    <g filter="url(#shB)" transform="translate(20,10)">
      <polygon points="740,190 748,212 732,212" fill="#8B7040"/>
      <polygon points="734,203 754,203 748,186 740,180" fill="#6A8848"/>
      <polygon points="737,195 751,195 744,177" fill="#7A9A55"/>
    </g>

    <!-- cluster bottom -->
    <g filter="url(#shB)">
      <polygon points="380,510 388,530 372,530" fill="#8B7040"/>
      <polygon points="374,520 398,520 392,503 380,497" fill="#6A8848"/>
      <polygon points="377,512 393,512 386,494" fill="#7A9A55"/>
    </g>
    <g filter="url(#shB)" transform="translate(15,5)">
      <polygon points="620,505 628,524 612,524" fill="#8B7040"/>
      <polygon points="614,515 638,515 632,499 620,493" fill="#6A8848"/>
      <polygon points="617,507 633,507 626,490" fill="#7A9A55"/>
    </g>

    <!-- flowers / bushes -->
    <circle cx="310" cy="350" r="8" fill="#E8C4B8" opacity=".7"/>
    <circle cx="320" cy="344" r="6" fill="#DDB8A8" opacity=".6"/>
    <circle cx="690" cy="355" r="8" fill="#C8D8A8" opacity=".7"/>
    <circle cx="700" cy="348" r="6" fill="#B8C898" opacity=".6"/>

    <!-- ══ BUILDING: VALS HQ / OVERVIEW — center back ══ -->
    <g id="bldHQ" class="bld" data-p="overview" style="cursor:pointer" filter="url(#sh)">
      <!-- base -->
      <polygon points="420,170 500,130 580,170 580,260 500,300 420,260" fill="#E8DDD0"/>
      <!-- top face -->
      <polygon points="420,170 500,130 580,170 500,210" fill="#F0E8DC"/>
      <!-- left face -->
      <polygon points="420,170 500,210 500,300 420,260" fill="#C8BEB0"/>
      <!-- right face -->
      <polygon points="580,170 500,210 500,300 580,260" fill="#D8CEC0"/>
      <!-- roof peak -->
      <polygon points="420,170 500,130 580,170 500,145" fill="#DDD4C8"/>
      <!-- VALS sign -->
      <rect x="462" y="148" width="76" height="20" rx="4" fill="#C9A882"/>
      <text x="500" y="163" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="Georgia,serif" letter-spacing="3">VALS</text>
      <!-- windows -->
      <rect x="435" y="185" width="14" height="10" rx="2" fill="#B8D4E8" opacity=".85"/>
      <rect x="455" y="185" width="14" height="10" rx="2" fill="#B8D4E8" opacity=".85"/>
      <rect x="435" y="203" width="14" height="10" rx="2" fill="#B8D4E8" opacity=".85"/>
      <rect x="455" y="203" width="14" height="10" rx="2" fill="#B8D4E8" opacity=".85"/>
      <rect x="511" y="185" width="14" height="10" rx="2" fill="#B8D4E8" opacity=".85"/>
      <rect x="531" y="185" width="14" height="10" rx="2" fill="#B8D4E8" opacity=".85"/>
      <rect x="511" y="203" width="14" height="10" rx="2" fill="#B8D4E8" opacity=".85"/>
      <rect x="531" y="203" width="14" height="10" rx="2" fill="#B8D4E8" opacity=".85"/>
      <!-- door -->
      <rect x="484" y="268" width="32" height="32" rx="4" fill="#9A7A5A"/>
      <circle cx="500" cy="284" r="2.5" fill="#C9A882"/>
      <!-- flag -->
      <line x1="500" y1="130" x2="500" y2="102" stroke="#8B6A4A" stroke-width="2"/>
      <polygon points="500,102 522,109 500,116" fill="#C9A882"/>
      <!-- hover label -->
      <text x="500" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="var(--brown)" font-family="Inter,sans-serif" opacity="0" class="blbl">ภาพรวม</text>
    </g>

    <!-- ══ BUILDING: SALES — left ══ -->
    <g id="bldSales" class="bld" data-p="sales" style="cursor:pointer" filter="url(#sh)">
      <polygon points="230,290 310,250 390,290 390,370 310,410 230,370" fill="#E0D4C4"/>
      <polygon points="230,290 310,250 390,290 310,330" fill="#EDE4D4"/>
      <polygon points="230,290 310,330 310,410 230,370" fill="#C4B8A8"/>
      <polygon points="390,290 310,330 310,410 390,370" fill="#D4C8B8"/>
      <!-- shop window -->
      <rect x="240" y="305" width="36" height="28" rx="3" fill="#B8D4E8" opacity=".7"/>
      <line x1="258" y1="305" x2="258" y2="333" stroke="#90B0C8" stroke-width="1"/>
      <line x1="240" y1="319" x2="276" y2="319" stroke="#90B0C8" stroke-width="1"/>
      <rect x="320" y="305" width="36" height="28" rx="3" fill="#B8D4E8" opacity=".7"/>
      <line x1="338" y1="305" x2="338" y2="333" stroke="#90B0C8" stroke-width="1"/>
      <line x1="320" y1="319" x2="356" y2="319" stroke="#90B0C8" stroke-width="1"/>
      <!-- sign -->
      <rect x="274" y="258" width="72" height="16" rx="3" fill="#B8965A"/>
      <text x="310" y="270" text-anchor="middle" font-size="9" font-weight="700" fill="white" font-family="Georgia,serif">SALES</text>
      <!-- door -->
      <rect x="293" y="377" width="34" height="33" rx="3" fill="#8B6A4A"/>
      <text x="310" y="245" text-anchor="middle" font-size="10" font-weight="700" fill="var(--brown)" font-family="Inter,sans-serif" opacity="0" class="blbl">ยอดขาย</text>
    </g>

    <!-- ══ BUILDING: FINANCE — right ══ -->
    <g id="bldFin" class="bld" data-p="finance" style="cursor:pointer" filter="url(#sh)">
      <polygon points="610,280 700,240 790,280 790,380 700,420 610,380" fill="#D8D0E8"/>
      <polygon points="610,280 700,240 790,280 700,320" fill="#E4DDF0"/>
      <polygon points="610,280 700,320 700,420 610,380" fill="#B8B0C8"/>
      <polygon points="790,280 700,320 700,420 790,380" fill="#C8C0D8"/>

<script>
// ── CONFIG ──────────────────────────────────────────────────────
const TOTAL_COST = 26913;
const BANK = {number:'1148058977',bank:'KBANK',name:'Charlene Chindapol'};
const UNIT_COST = {ts:117.84,fd_petite:79.70,fd:21.93};
const PROD_NAMES = {ts:'The Sparkling',fd_petite:'FD Petite',fd:'FD Standard'};
const PROD_PRICE = {ts:449,fd_petite:379,fd:379};
const CHAN_NAMES = {studio_peachlates:'Peachlates',studio_madimadi:'Madi Madi',
  shopee:'Shopee',ig_line:'IG/Line',workshop:'Workshop'};
const CHAN_DEF = {
  studio_peachlates:{gp:20,ship:0,pf:0},
  studio_madimadi:{gp:0,ship:0,pf:0},
  shopee:{gp:0,ship:55,pf:66},
  ig_line:{gp:0,ship:50,pf:0},
  workshop:{gp:0,ship:0,pf:0},
};
const PANELS = {
  overview:{ico:'🏛',title:'ภาพรวม VALS'},
  sales:{ico:'📊',title:'ยอดขาย'},
  finance:{ico:'💰',title:'การเงิน'},
  stock:{ico:'📦',title:'สต็อกสินค้า'},
  marketing:{ico:'✨',title:'การตลาด'},
  events:{ico:'🎪',title:'Workshop & Events'},
  kol:{ico:'🌟',title:'KOL / Creator'},
  content:{ico:'📅',title:'Content Calendar'},
  invoice:{ico:'🧾',title:'ใบสรุปยอด'},
};

// ── STATE ─────────────────────────────────────────────────────────
let db=null, sales=[], expenses=[], kols=[], contents=[];
let curPanel='', selProd='ts', selChan='studio_peachlates', selCat='การตลาด';
let selCst='plan', editSaleId=null;

// ── HELPERS ───────────────────────────────────────────────────────
const f2 = n=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const f0 = n=>Number(n).toLocaleString('th-TH',{maximumFractionDigits:0});
const f1 = n=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:1,maximumFractionDigits:1});

function calcSale(s){
  const u=UNIT_COST[s.product]||0;
  const gross=s.sale_price*s.qty;
  const gp=gross*(s.gp_pct/100);
  const net=gross-gp;
  const cost=(u*s.qty)+(+s.shipping||0)+(+s.platform_fee||0);
  const profit=net-cost;
  const margin=net>0?profit/net*100:0;
  return{gross,gp,net,cost,profit,margin};
}

function toast(msg,ok=true){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=ok?'var(--brown)':'var(--red)';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

// ── DB INIT ───────────────────────────────────────────────────────
async function init(){
  try{
    db=await claude.use('db');
    if(!db){fallback();return;}
    db.collection('sales').onSnapshot(snap=>{sales=snap.docs.map(d=>d.data());refresh();});
    db.collection('expenses').onSnapshot(snap=>{expenses=snap.docs.map(d=>d.data());refresh();});
    db.collection('kols').onSnapshot(snap=>{kols=snap.docs.map(d=>d.data());refresh();});
    db.collection('contents').onSnapshot(snap=>{contents=snap.docs.map(d=>d.data());refresh();});
    document.getElementById('syncLbl').textContent='Live ✓';
  }catch(e){fallback();}
}
function fallback(){document.getElementById('syncLbl').textContent='Offline';refresh();}

// ── METRICS ───────────────────────────────────────────────────────
function metrics(){
  const rev=sales.reduce((s,o)=>s+calcSale(o).net,0);
  const profit=sales.reduce((s,o)=>s+calcSale(o).profit,0);
  const units=sales.reduce((s,o)=>s+(+o.qty),0);
  const exp=expenses.reduce((s,e)=>s+(+e.amount),0);
  const recov=Math.min(rev/TOTAL_COST*100,100);
  const margin=rev>0?profit/rev*100:0;
  return{rev,profit,units,exp,recov,margin};
}

function refresh(){
  const m=metrics();
  document.getElementById('hRev').textContent='฿'+f0(m.rev);
  document.getElementById('hProfit').textContent=(m.profit<0?'-':'')+'฿'+f0(Math.abs(m.profit));
  document.getElementById('hProfit').style.color=m.profit>=0?'var(--green)':'var(--red)';
  document.getElementById('hUnits').textContent=m.units+' คู่';
  document.getElementById('hRecov').textContent=f1(m.recov)+'%';
  // update character tasks dynamically
  updateCharTasks();
  if(curPanel) renderPanel(curPanel);
}

function updateCharTasks(){
  // cat: latest strategic note
  const latestSale=sales.sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(latestSale) document.getElementById('catTask').textContent='ล่าสุด: '+latestSale.date.slice(5);
  // frog: total mkt spend
  const mktSpend=expenses.filter(e=>e.category==='การตลาด').reduce((s,e)=>s+(+e.amount),0);
  if(mktSpend) document.getElementById('frogTask').textContent='Ads ฿'+f0(mktSpend);
  // bear: total expenses
  document.getElementById('bearTask').textContent='รายจ่าย ฿'+f0(expenses.reduce((s,e)=>s+(+e.amount),0));
  // rabbit: stock avail
  const soldTS=sales.filter(s=>s.product==='ts').reduce((s,o)=>s+(+o.qty),0);
  document.getElementById('rabbitTask').textContent='TS เหลือ '+(100-3-4-6-soldTS)+' คู่';
  // duck: content count
  document.getElementById('duckTask').textContent='Content: '+contents.length+' แผน';
  // dog: ws events
  const wsExp=expenses.filter(e=>e.category==='Workshop');
  document.getElementById('dogTask').textContent='WS ฿'+f0(wsExp.reduce((s,e)=>s+(+e.amount),0));
}

// ── BUILDING CLICKS ───────────────────────────────────────────────
document.querySelectorAll('.bld').forEach(g=>{
  g.addEventListener('click',()=>openPanel(g.dataset.p));
  g.addEventListener('mouseenter',()=>{
    const lbl=g.querySelector('.blbl');
    if(lbl) lbl.setAttribute('opacity','1');
  });
  g.addEventListener('mouseleave',()=>{
    const lbl=g.querySelector('.blbl');
    if(lbl) lbl.setAttribute('opacity','0');
  });
});

// ── PANEL ─────────────────────────────────────────────────────────
function openPanel(id,navBtn){
  curPanel=id;
  const p=PANELS[id]||{ico:'◎',title:id};
  document.getElementById('pIco').textContent=p.ico;
  document.getElementById('pTitle').textContent=p.title;
  renderPanel(id);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
  // nav highlight
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('ac'));
  if(navBtn) navBtn.classList.add('ac');
  else{const nb=document.querySelector(`.nb[data-p="${id}"]`);if(nb)nb.classList.add('ac');}
  // building highlight ring
  const ringMap={overview:'hlHQ',sales:'hlSales',finance:'hlFin',stock:'hlStock',
    marketing:'hlMkt',events:'hlWS',kol:'hlKOL',content:'hlContent',invoice:'hlInv'};
  document.querySelectorAll('[id^="hl"]').forEach(e=>e.setAttribute('opacity','0'));
  const r=document.getElementById(ringMap[id]);
  if(r){r.setAttribute('opacity','0.7');}
}
function closePanel(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('[id^="hl"]').forEach(e=>e.setAttribute('opacity','0'));
  curPanel='';
}

function renderPanel(id){
  const body=document.getElementById('pBody');
  const fns={overview:rOverview,sales:rSales,finance:rFinance,stock:rStock,
    marketing:rMarketing,events:rEvents,kol:rKol,content:rContent,invoice:rInvoice};
  body.innerHTML=(fns[id]||rEmpty)();
}

// ── PANEL RENDERERS ───────────────────────────────────────────────
function rEmpty(){return`<p style="color:var(--muted);font-size:13px">Coming soon</p>`;}

function rOverview(){
  const m=metrics();
  const chRevs={};
  sales.forEach(s=>{const r=calcSale(s).net;chRevs[s.channel]=(chRevs[s.channel]||0)+r;});
  const maxCh=Math.max(...Object.values(chRevs),1);
  const chHtml=Object.entries(chRevs).sort((a,b)=>b[1]-a[1]).map(([ch,v])=>`
    <div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;margin-bottom:2px">
        <span style="font-size:12px;font-weight:600">${CHAN_NAMES[ch]||ch}</span>
        <span style="font-size:12px;font-weight:700">฿${f0(v)}</span>
      </div>
      <div class="bw"><div class="bf" style="width:${v/maxCh*100}%"></div></div>
    </div>`).join('');
  const prodUnits={};
  sales.forEach(s=>{prodUnits[s.product]=(prodUnits[s.product]||0)+(+s.qty);});
  const prodRows=Object.entries(prodUnits).map(([p,u])=>`
    <tr><td>${PROD_NAMES[p]||p}</td>
    <td class="nr">${u} คู่</td>
    <td class="nr pos">฿${f0(sales.filter(s=>s.product===p).reduce((sum,s)=>sum+calcSale(s).net,0))}</td></tr>`).join('');
  return`
    <div class="kgrid">
      <div class="kbox hi"><div class="kv">฿${f0(m.rev)}</div><div class="kl">รายได้</div></div>
      <div class="kbox"><div class="kv" style="color:${m.profit>=0?'var(--green)':'var(--red)'}">฿${f0(m.profit)}</div><div class="kl">กำไร</div></div>
      <div class="kbox"><div class="kv">${m.units}</div><div class="kl">คู่ขายได้</div></div>
      <div class="kbox"><div class="kv">฿${f0(m.exp)}</div><div class="kl">รายจ่าย</div></div>
    </div>
    <div style="background:var(--ivory);border-radius:12px;padding:13px;margin-bottom:14px;border:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;margin-bottom:7px">
        <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted)">Progress คืนทุน</span>
        <span style="font-family:Georgia,serif;font-size:15px;font-weight:700;color:var(--tan)">${f1(m.recov)}%</span>
      </div>
      <div class="bw" style="height:10px"><div class="bf" style="width:${m.recov}%"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--muted)">
        <span>ยอดขาย ฿${f0(m.rev)}</span><span>เป้า ฿${f0(TOTAL_COST)}</span>
      </div>
    </div>
    <div class="sh"><span class="st">รายได้แยกช่องทาง</span></div>
    <div style="margin-bottom:14px">${chHtml||'<p style="color:var(--muted);font-size:12px">ยังไม่มีข้อมูล</p>'}</div>
    <div class="sh"><span class="st">ยอดขายแยกรุ่น</span></div>
    <table class="tbl" style="margin-bottom:14px">
      <thead><tr><th>รุ่น</th><th class="nr">คู่</th><th class="nr">รายได้</th></tr></thead>
      <tbody>${prodRows||'<tr><td colspan="3" style="color:var(--muted)">ยังไม่มี</td></tr>'}</tbody>
    </table>`;
}

function rSales(){
  const sorted=[...sales].sort((a,b)=>b.date.localeCompare(a.date));
  const rows=sorted.map(s=>{
    const c=calcSale(s);
    const mc=c.margin>=40?'var(--green)':c.margin>=20?'var(--tan)':'var(--red)';
    return`<tr onclick="openSaleMod('${s.id}')" style="cursor:pointer">

function sc(btn,type){
  btn.parentElement.querySelectorAll('.ch').forEach(c=>c.classList.remove('sl'));
  btn.classList.add('sl');
  const v=btn.dataset.v;
  if(type==='prod'){selProd=v;document.getElementById('sPrice').value=PROD_PRICE[v]||449;updatePrev();}
  else if(type==='chan'){selChan=v;const d=CHAN_DEF[v]||{};
    document.getElementById('sGP').value=d.gp||0;
    document.getElementById('sShip').value=d.ship||0;
    document.getElementById('sPF').value=d.pf||0;updatePrev();}
  else if(type==='cat'){selCat=v;}
  else if(type==='cst'){selCst=v;}
}

function openSaleMod(id=null){
  editSaleId=id;
  document.getElementById('smTitle').textContent=id?'แก้ไขยอดขาย':'บันทึกยอดขาย';
  if(id){
    const s=sales.find(x=>x.id===id)||{};
    selProd=s.product||'ts'; selChan=s.channel||'studio_peachlates';
    document.getElementById('sDate').value=s.date||'';
    document.getElementById('sQty').value=s.qty||1;
    document.getElementById('sPrice').value=s.sale_price||449;
    document.getElementById('sGP').value=s.gp_pct||0;
    document.getElementById('sShip').value=s.shipping||0;
    document.getElementById('sPF').value=s.platform_fee||0;
    document.getElementById('sNote').value=s.note||'';
  } else {
    selProd='ts'; selChan='studio_peachlates';
    document.getElementById('sDate').value=new Date().toISOString().slice(0,10);
    document.getElementById('sQty').value=1; document.getElementById('sPrice').value=449;
    document.getElementById('sGP').value=0; document.getElementById('sShip').value=0;
    document.getElementById('sPF').value=0; document.getElementById('sNote').value='';
  }
  document.querySelectorAll('[data-v]').forEach(b=>{
    if(b.closest('#saleMod')){
      if(b.parentElement.id&&b.parentElement.id.includes('prod'))b.classList.toggle('sl',b.dataset.v===selProd);
    }
  });
  ['sQty','sPrice','sGP','sShip','sPF'].forEach(i=>document.getElementById(i).addEventListener('input',updatePrev));
  updatePrev();
  document.getElementById('saleMod').classList.add('open');
}
function closeSaleMod(){document.getElementById('saleMod').classList.remove('open');editSaleId=null;}

function updatePrev(){
  const s={product:selProd,qty:+document.getElementById('sQty').value||1,
    sale_price:+document.getElementById('sPrice').value||0,
    gp_pct:+document.getElementById('sGP').value||0,
    shipping:+document.getElementById('sShip').value||0,
    platform_fee:+document.getElementById('sPF').value||0};
  const c=calcSale(s);
  document.getElementById('prvRev').textContent='฿'+f2(c.net);
  document.getElementById('prvPro').style.color=c.profit>=0?'#6EE7A0':'#FCA5A5';
  document.getElementById('prvPro').textContent='฿'+f2(c.profit);
  document.getElementById('prvMar').style.color=c.margin>=40?'#6EE7A0':c.margin>=20?'#FCD34D':'#FCA5A5';
  document.getElementById('prvMar').textContent=c.margin.toFixed(1)+'%';
}

async function saveSale(){
  const s={id:editSaleId||'s_'+Date.now(),date:document.getElementById('sDate').value,
    product:selProd,qty:+document.getElementById('sQty').value||1,channel:selChan,
    sale_price:+document.getElementById('sPrice').value||0,gp_pct:+document.getElementById('sGP').value||0,
    shipping:+document.getElementById('sShip').value||0,platform_fee:+document.getElementById('sPF').value||0,
    bag:0,print:0,other_cost:0,note:document.getElementById('sNote').value};
  try{
    if(db)await db.doc('sales/'+s.id).set(s);
    else{const i=sales.findIndex(x=>x.id===s.id);if(i>=0)sales[i]=s;else sales.push(s);refresh();}
    closeSaleMod();toast(editSaleId?'แก้ไขแล้ว ✓':'บันทึกยอดขายแล้ว ✓');
  }catch(e){toast('เกิดข้อผิดพลาด',false);}
}

// ── EXPENSE MODAL ─────────────────────────────────────────────────
function openExpMod(cat){
  if(cat){selCat=cat;document.querySelectorAll('#expMod .ch').forEach(c=>c.classList.toggle('sl',c.dataset.v===cat));}
  document.getElementById('eDesc').value='';document.getElementById('eAmt').value='';
  document.getElementById('eDate').value=new Date().toISOString().slice(0,10);
  document.getElementById('expMod').classList.add('open');
}
function closeExpMod(){document.getElementById('expMod').classList.remove('open');}
async function saveExp(){
  const e={id:'e_'+Date.now(),date:document.getElementById('eDate').value,
    category:selCat,desc:document.getElementById('eDesc').value,amount:+document.getElementById('eAmt').value||0};
  if(!e.desc||!e.amount){toast('กรุณากรอกข้อมูลให้ครบ',false);return;}
  try{
    if(db)await db.doc('expenses/'+e.id).set(e);
    else{expenses.push(e);refresh();}
    closeExpMod();toast('บันทึกรายจ่ายแล้ว ✓');
  }catch(err){toast('เกิดข้อผิดพลาด',false);}
}

// ── KOL MODAL ────────────────────────────────────────────────────
function openKolMod(){
  ['kName','kItem','kNote'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('kSent').value=new Date().toISOString().slice(0,10);
  document.getElementById('kStatus').value='sent';
  document.getElementById('kolMod').classList.add('open');
}
function closeKolMod(){document.getElementById('kolMod').classList.remove('open');}
async function saveKol(){
  const k={id:'k_'+Date.now(),name:document.getElementById('kName').value,
    platform:document.getElementById('kPlatform').value,item:document.getElementById('kItem').value,
    sent:document.getElementById('kSent').value,status:document.getElementById('kStatus').value,
    note:document.getElementById('kNote').value};
  if(!k.name){toast('กรุณาใส่ชื่อ KOL',false);return;}
  try{
    if(db)await db.doc('kols/'+k.id).set(k);
    else{kols.push(k);refresh();}
    closeKolMod();toast('เพิ่ม KOL แล้ว ✓');
  }catch(e){toast('เกิดข้อผิดพลาด',false);}
}

// ── CONTENT MODAL ─────────────────────────────────────────────────
function openContentMod(){
  ['cTitle','cNote'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('cDate').value=new Date().toISOString().slice(0,10);
  selCst='plan';
  document.querySelectorAll('#contentMod .ch').forEach(c=>c.classList.toggle('sl',c.dataset.v==='plan'));
  document.getElementById('contentMod').classList.add('open');
}
function closeContentMod(){document.getElementById('contentMod').classList.remove('open');}
async function saveContent(){
  const c={id:'c_'+Date.now(),title:document.getElementById('cTitle').value,
    channel:document.getElementById('cChan').value,date:document.getElementById('cDate').value,
    status:selCst,note:document.getElementById('cNote').value};
  if(!c.title){toast('กรุณาใส่หัวข้อ',false);return;}
  try{
    if(db)await db.doc('contents/'+c.id).set(c);
    else{contents.push(c);refresh();}
    closeContentMod();toast('เพิ่ม content plan แล้ว ✓');
  }catch(e){toast('เกิดข้อผิดพลาด',false);}
}

// ── MODAL BG CLOSE ────────────────────────────────────────────────
['saleMod','expMod','kolMod','contentMod'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});
});

// ── INIT ──────────────────────────────────────────────────────────
openPanel('overview');
init();
</script>
</body>
</html>
